name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The codec reference, Q8 repack, loader logic and the MoE ops path all run on
  # Linux with the CPU backend. Metal/checkpoint tests self-skip via markers.
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (validated stack, CPU backend)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' 'mlx[cpu]==0.32.*' 'mlx-lm==0.31.3'
      - name: Gates
        run: pytest tests/ -v

  # macOS arm64 runners are Apple Silicon. If the virtualized runner exposes
  # Metal, the kernel bit-exactness gates run for real; if not, they self-skip
  # (the "Metal available" step below tells you which happened — check it when
  # reading a green run).
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (validated stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' 'mlx==0.32.*' 'mlx-lm==0.31.3'
      - name: Metal available?
        run: python -c "import mlx.core as mx; print('metal:', mx.metal.is_available(), 'mlx:', mx.__version__)"
      - name: Gates
        run: pytest tests/ -v
